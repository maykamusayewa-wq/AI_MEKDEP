<!doctype html><html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin giriş — AI MEKDEP</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eaf4ff,#effdf8);min-height:100vh;display:grid;place-items:center;color:#0f2344}.box{width:min(430px,92vw);background:#fff;padding:34px;border-radius:24px;box-shadow:0 20px 50px #163c7020}.logo{text-align:center;font-size:30px;font-weight:900;color:#075fca}.sub{text-align:center;color:#64748b;margin:8px 0 24px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#0b72d8,#6b3cec);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;margin-bottom:12px}.back{display:block;text-align:center;margin-top:16px;color:#075fca;text-decoration:none;font-weight:700}</style></head><body><div class="box"><div class="logo">🛡️ AI MEKDEP ADMIN</div><div class="sub">Platformany dolandyrmak</div>{% if error %}<div class="err">{{ error }}</div>{% endif %}<form method="post"><div class="field"><label>Login</label><input name="username" required></div><div class="field"><label>Parol</label><input name="password" type="password" required></div><button class="btn">Giriş</button></form><a class="back" href="/">← Baş sahypa</a></div></body></html>
