<!DOCTYPE html><html lang="tk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI MEKDEP — AI kömekçi</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#eef5fb;color:#172033}.head{background:linear-gradient(120deg,#6d37ef,#0877e6);color:#fff;padding:30px;text-align:center}.wrap{width:92%;max-width:1000px;margin:24px auto}.back{display:inline-block;background:#fff;color:#1260c9;padding:10px 17px;border-radius:24px;text-decoration:none;font-weight:700}.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 6px 22px #0001}.selects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.selects select,textarea{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:12px;font:inherit}textarea{min-height:130px;margin-top:14px}.btn{margin-top:12px;border:0;background:#6d37ef;color:#fff;padding:12px 20px;border-radius:24px;font-weight:800;cursor:pointer}.answer{white-space:pre-wrap;line-height:1.7;background:#f5f1ff;border-left:5px solid #6d37ef;padding:18px;border-radius:14px;margin-top:18px}.error{background:#fff3cd;color:#765600;padding:14px;border-radius:12px;margin-top:15px}@media(max-width:700px){.selects{grid-template-columns:1fr}}
</style></head><body><div class="head"><h1>🤖 AI kömekçi</h1><p>Synp, ders we tema saýlap sorag ber</p></div><main class="wrap"><a class="back" href="/">← Baş sahypa</a><form class="card" method="post"><div class="selects"><select id="g"><option value="">Synp</option>{% for x in range(5,13) %}<option value="{{x}}">{{x}}-nji synp</option>{% endfor %}</select><select id="s"><option value="">Ders</option></select><select name="topic_id" id="t" required><option value="">Tema</option></select></div><textarea name="question" placeholder="Soragyňy ýaz...">{{question}}</textarea><button class="btn" type="submit">AI-den sora</button>{% if error %}<div class="error">{{error}}</div>{% endif %}{% if answer %}<div class="answer"><strong>AI jogaby:</strong><br>{{answer}}</div>{% endif %}</form></main><script>
const TOP={{topics_data|tojson}},g=document.getElementById('g'),s=document.getElementById('s'),t=document.getElementById('t');g.onchange=()=>{let names=[...new Set(TOP.filter(x=>String(x.class_number)===g.value).map(x=>x.subject))].sort();s.innerHTML='<option value="">Ders</option>'+names.map(n=>`<option>${n}</option>`).join('');t.innerHTML='<option value="">Tema</option>'};s.onchange=()=>{let rows=TOP.filter(x=>String(x.class_number)===g.value&&x.subject===s.value);t.innerHTML='<option value="">Tema</option>'+rows.map(x=>`<option value="${x.id}">${x.topic}</option>`).join('')};
</script></body></html>
