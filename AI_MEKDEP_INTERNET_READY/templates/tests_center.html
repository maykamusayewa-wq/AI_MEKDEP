<!DOCTYPE html><html lang="tk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI MEKDEP — Testler</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f3f7fc;color:#172033}.head{background:linear-gradient(120deg,#0b72df,#8a3ee8);color:#fff;padding:28px;text-align:center}.wrap{width:94%;max-width:1300px;margin:24px auto}.back{display:inline-block;background:#fff;color:#1260c9;padding:10px 17px;border-radius:24px;text-decoration:none;font-weight:700}.filter{background:#fff;padding:18px;border-radius:18px;margin:18px 0;display:flex;gap:12px;flex-wrap:wrap;box-shadow:0 4px 15px #0001}.filter select,.filter button{padding:11px 12px;border-radius:10px;border:1px solid #cfd8e6;font:inherit}.filter button{background:#075fc5;color:#fff;border:0;font-weight:700}.list{display:grid;gap:10px}.row{background:#fff;border-radius:15px;padding:15px 18px;display:grid;grid-template-columns:90px 180px 1fr 110px 120px;align-items:center;gap:10px;box-shadow:0 3px 12px #0001}.tag{font-size:13px;color:#64748b}.count{font-weight:800;color:#0b9563}.btn{background:#0877e6;color:#fff;text-decoration:none;padding:9px 12px;border-radius:10px;text-align:center;font-weight:700}.empty{padding:30px;background:#fff;border-radius:16px;text-align:center}@media(max-width:850px){.row{grid-template-columns:1fr}.row>*{text-align:left}}
</style></head><body><div class="head"><h1>📝 Testler merkezi</h1><p>Synp we ders boýunça tema saýla</p></div><main class="wrap"><a class="back" href="/">← Baş sahypa</a><form class="filter" method="get"><select name="class" id="classSelect"><option value="">Ähli synplar</option>{% for g in range(5,13) %}<option value="{{g}}" {% if selected_class==g|string %}selected{% endif %}>{{g}}-nji synp</option>{% endfor %}</select><select name="subject" id="subjectSelect"><option value="">Ähli dersler</option></select><button type="submit">Görkez</button></form><div class="list">{% for r in rows %}<div class="row"><strong>{{r.class_number}} synp</strong><span>{{r.subject}}</span><div><strong>{{r.topic}}</strong><div class="tag">{{r.section}}</div></div><span class="count">{{r.test_count}} sorag</span><a class="btn" href="/test?topic={{r.id}}">Aç</a></div>{% else %}<div class="empty">Tema tapylmady.</div>{% endfor %}</div></main><script>
const DATA={{subjects_by_class|tojson}}, cls=document.getElementById('classSelect'), sub=document.getElementById('subjectSelect'), selected={{selected_subject|tojson}};function fill(){let g=cls.value,items=g?(DATA[g]||[]):Object.values(DATA).flat();let names=[...new Set(items.map(x=>x.name))].sort();sub.innerHTML='<option value="">Ähli dersler</option>'+names.map(n=>`<option value="${n}" ${n===selected?'selected':''}>${n}</option>`).join('')}cls.addEventListener('change',fill);fill();</script></body></html>
