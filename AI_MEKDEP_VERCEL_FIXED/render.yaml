services:
  - type: web
    name: ai-mekdep
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: AI_MEKDEP_DATA_DIR
        value: /var/data
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: ai-mekdep-data
      mountPath: /var/data
      sizeGB: 20
