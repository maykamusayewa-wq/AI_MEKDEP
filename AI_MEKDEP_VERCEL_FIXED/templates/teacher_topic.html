<!DOCTYPE html><html lang="tk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tema redaktirlemek</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#f3f7fc;color:#172033}.wrap{width:92%;max-width:1000px;margin:25px auto}.card{background:#fff;padding:24px;border-radius:20px;box-shadow:0 5px 18px #0001;margin-top:15px}select,textarea{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:10px;margin:7px 0;font:inherit}textarea{min-height:150px}.btn{border:0;background:#075fc5;color:#fff;padding:11px 17px;border-radius:10px;font-weight:700}.back{color:#075fc5;text-decoration:none;font-weight:700}.ok{background:#e9fff5;color:#087653;padding:12px;border-radius:10px}</style></head><body><main class="wrap"><a class="back" href="/teacher/dashboard">← Mugallym paneli</a><section class="card"><form method="get"><select name="topic_id" onchange="this.form.submit()"><option value="">Tema saýla</option>{% for x in topics_data %}<option value="{{x.id}}" {% if topic and x.id==topic.id %}selected{% endif %}>{{x.class_number}} synp • {{x.subject}} • {{x.topic}}</option>{% endfor %}</select></form></section>{% if topic %}<form class="card" method="post"><input type="hidden" name="topic_id" value="{{topic.id}}"><h2>{{topic.class_number}} synp — {{topic.subject}}</h2><h3>{{topic.topic}}</h3>{% if saved %}<div class="ok">Saklandy ✅</div>{% endif %}<label>Düşündiriş</label><textarea name="explanation">{{topic.explanation or ''}}</textarea><label>Mysal</label><textarea name="example_text">{{topic.example_text or ''}}</textarea><label>Amaly iş</label><textarea name="practical_task">{{topic.practical_task or ''}}</textarea><button class="btn">Sakla</button></form>{% endif %}</main></body></html>
