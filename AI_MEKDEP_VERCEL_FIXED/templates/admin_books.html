<!doctype html><html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kitaphana — Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f4f7fb;color:#172554}.top{background:#0b63c8;color:#fff;padding:18px 4%}.top a{color:#fff}.wrap{max-width:1300px;margin:25px auto;padding:0 20px}.box{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #24466a10}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}.del{border:0;background:#fee2e2;color:#b91c1c;padding:8px 10px;border-radius:8px;font-weight:700}</style></head><body><div class="top"><a href="/admin/dashboard">← Admin panel</a></div><main class="wrap"><h1>📚 Elektron kitaphana dolandyryşy</h1><div class="box"><table><tr><th>Kitap</th><th>Synp</th><th>Ders</th><th>Ýükledi</th><th>Wagt</th><th></th></tr>{% for b in books %}<tr><td><b>{{b['title']}}</b><br><small>{{b['author'] or ''}}</small></td><td>{{b['class_number']}}</td><td>{{b['subject']}}</td><td>{{b['uploaded_by'] or '—'}}</td><td>{{b['uploaded_at']}}</td><td><a href="/library/book/{{b['id']}}">Aç</a> <form style="display:inline" method="post" action="/admin/books/{{b['id']}}/delete" onsubmit="return confirm('Kitaby pozmalymy?')"><button class="del">Poz</button></form></td></tr>{% else %}<tr><td colspan="6">Kitap ýok.</td></tr>{% endfor %}</table></div></main></body></html>
