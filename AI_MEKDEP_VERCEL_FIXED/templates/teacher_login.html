<!DOCTYPE html><html lang="tk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mugallym giriş</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#edf6ff,#f7f0ff);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#172033}.card{width:min(430px,92vw);background:#fff;border-radius:24px;padding:30px;box-shadow:0 15px 45px #3355aa22}.logo{text-align:center;font-size:40px}.card h1{text-align:center;color:#075fc5;margin:10px 0 6px}.sub{text-align:center;color:#667085;margin-bottom:22px}.error{background:#ffe8e8;color:#a11;padding:11px;border-radius:12px;margin-bottom:12px}label{display:block;font-weight:700;margin:10px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:11px;font:inherit}button,.register{width:100%;display:block;text-align:center;margin-top:14px;padding:12px;border-radius:12px;border:0;font-weight:800;text-decoration:none;cursor:pointer}.login{background:#075fc5;color:white}.register{background:#eaf3ff;color:#075fc5}.home{display:block;text-align:center;margin-top:16px;color:#64748b;text-decoration:none}
</style></head><body><main class="card"><div class="logo">👩‍🏫</div><h1>Mugallym giriş</h1><div class="sub">Öz loginiňiz we parolyňyz bilen giriň</div>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label>Login</label><input name="username" autocomplete="username" required><label>Parol</label><input type="password" name="password" autocomplete="current-password" required><button class="login">Giriş</button></form><a class="register" href="/teacher/register">Täze mugallym hasabyny döret</a><a class="home" href="/">← Baş sahypa</a></main></body></html>
