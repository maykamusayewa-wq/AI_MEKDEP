<!doctype html><html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Netijeler — Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f4f7fb;color:#172554}.top{background:#0b63c8;color:#fff;padding:18px 4%}.top a{color:#fff}.wrap{max-width:1400px;margin:25px auto;padding:0 20px}.box{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #24466a10}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}.pct{font-weight:900;color:#075fca}</style></head><body><div class="top"><a href="/admin/dashboard">← Admin panel</a></div><main class="wrap"><h1>📊 Okuwçylaryň test netijeleri</h1><div class="box"><table><tr><th>Okuwçy</th><th>Synp</th><th>Ders</th><th>Test</th><th>Mugallym</th><th>Netije</th><th>Wagt</th></tr>{% for r in rows %}<tr><td>{{r['student_name']}}</td><td>{{r['class_number']}}</td><td>{{r['subject']}}</td><td>{{r['title']}}</td><td>{{r['teacher_name']}}</td><td><span class="pct">{{r['percent']}}%</span> ({{r['score']}}/{{r['total']}})</td><td>{{r['created_at']}}</td></tr>{% else %}<tr><td colspan="7">Netije ýok.</td></tr>{% endfor %}</table></div></main></body></html>
